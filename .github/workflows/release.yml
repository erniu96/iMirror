name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      IMIRROR_ALLOW_SOFTWARE_DECODER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check tag matches app version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $version" >&2
            exit 1
          fi
      - name: Cache OpenSSL build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .dependencies
          key: openssl-${{ matrix.runner }}-${{ hashFiles('Scripts/prepare-openssl.sh') }}
      - name: Build and run all tests
        run: ./build.sh test
      - name: Archive app
        run: ditto -c -k --keepParent build/iMirror.app "iMirror-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ matrix.arch }}
          path: iMirror-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish universal app
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: app-*
          merge-multiple: true
          path: artifacts
      - name: Merge architectures into a universal app
        run: |
          set -euo pipefail
          ditto -x -k artifacts/iMirror-arm64.zip arm64
          ditto -x -k artifacts/iMirror-x86_64.zip x86_64
          ditto arm64/iMirror.app universal/iMirror.app
          for binary in Contents/MacOS/iMirror Contents/Frameworks/libcrypto.3.dylib; do
            lipo -create "arm64/iMirror.app/$binary" "x86_64/iMirror.app/$binary" \
              -output "universal/iMirror.app/$binary"
            lipo "universal/iMirror.app/$binary" -verify_arch arm64 x86_64
          done
          # lipo invalidates the per-architecture signatures; re-sign ad hoc.
          codesign --force --sign - universal/iMirror.app/Contents/Frameworks/libcrypto.3.dylib
          codesign --force --sign - universal/iMirror.app
          codesign --verify --deep --strict universal/iMirror.app
      - name: Package
        id: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="iMirror-$version-macOS-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent universal/iMirror.app "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" \
              --title "iMirror $VERSION" \
              --notes-file .github/release-notes.md
          fi
