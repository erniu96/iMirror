name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: C protocol tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: ./Scripts/test-protocol.sh

  macos:
    name: macOS (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      IMIRROR_ALLOW_SOFTWARE_DECODER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Cache OpenSSL build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .dependencies
          key: openssl-${{ matrix.runner }}-${{ hashFiles('Scripts/prepare-openssl.sh') }}
      - name: Check shell scripts
        run: |
          for script in command.txt install.sh build.sh Scripts/*.sh; do
            case "$(head -n 1 "$script")" in
              *zsh*) zsh -n "$script" ;;
              *bash*) bash -n "$script" ;;
              *) sh -n "$script" ;;
            esac
          done
      - name: Build, verify signing, and run all tests
        run: ./build.sh test
      - name: Install into a temporary Applications folder
        run: |
          IMIRROR_INSTALL_DIR="$RUNNER_TEMP/Applications" ./install.sh --no-open
          codesign --verify --deep --strict "$RUNNER_TEMP/Applications/iMirror.app"
      - name: Build disk image
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          PATH="$RUNNER_TEMP/dmgbuild/bin:$PATH" ./Scripts/make-dmg.sh build/iMirror.app "$RUNNER_TEMP/iMirror.dmg"
          mount_point="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$RUNNER_TEMP/iMirror.dmg"
          trap 'hdiutil detach "$mount_point"' EXIT
          test "$(readlink "$mount_point/Applications")" = /Applications
          ls "$mount_point"/.background.*
          codesign --verify --deep --strict "$mount_point/iMirror.app"

