name: 问题报告 / Bug report
description: iMirror 不工作或行为不对 / Something in iMirror doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先看 README 的“常见问题”，并搜索已有 Issue。可以用中文或英文填写。
        Thanks for the report! Please check Troubleshooting in the README and search existing issues first. English or Chinese is fine.
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened
      description: 问题现象，以及你期望的结果 / What you saw and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 打开 iMirror / Open iMirror
        2. 在 iPhone 上选择“屏幕镜像” / Choose Screen Mirroring on the iPhone
        3. ...
    validations:
      required: true
  - type: input
    id: imirror-version
    attributes:
      label: iMirror 版本 / iMirror version
      description: 设置 → 关于 / Settings → About
      placeholder: "1.2.1"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: macOS 版本和 Mac 机型 / macOS version and Mac model
      placeholder: "macOS 15.5, MacBook Air M2"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 投屏设备 / Mirroring device
      description: 型号和系统版本 / Model and OS version
      placeholder: "iPhone 15, iOS 18.5"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 安装方式 / How you installed it
      options:
        - GitHub Release dmg
        - install.sh（从源码 / from source）
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 截图或日志（可选）/ Screenshots or logs (optional)
      description: 可在“控制台”App 中筛选 iMirror 进程的日志；请先去掉个人信息。/ Console.app can filter logs by the iMirror process; remove personal information first.
