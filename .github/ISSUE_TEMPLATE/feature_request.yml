name: 功能建议 / Feature request
description: 建议新功能或改进 / Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem would it solve
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望的做法 / What you'd like
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息（可选）/ Anything else (optional)
