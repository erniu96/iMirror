<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <rect id="body" x="100" y="100" width="824" height="824" rx="185"/>
    <clipPath id="bodyClip"><use href="#body"/></clipPath>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="0.55" stop-color="#4F5BEA"/>
      <stop offset="1" stop-color="#6A35C9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE2F2"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9D1E8"/>
      <stop offset="1" stop-color="#EEF1FA"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="0.5" stop-color="#FF5F7A"/>
      <stop offset="1" stop-color="#8E3BEF"/>
    </linearGradient>
    
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="6" dy="14"/>
      <feFlood flood-color="#1A1060" flood-opacity="0.45"/>
      <feComposite operator="in" in2="SourceAlpha" result="none"/>
      <feComposite operator="in" in2="SourceAlpha"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <g filter="url(#iconShadow)">
    <use href="#body" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#bodyClip)">
    <use href="#body" fill="url(#glow)"/>

    <!-- Mac display -->
    <rect x="300" y="250" width="500" height="340" rx="32" fill="#1B1464" fill-opacity="0.35" filter="url(#soft)" transform="translate(0,16)"/>
    <path d="M520,588 L586,588 L604,656 L502,656 Z" fill="url(#stand)"/>
    <rect x="470" y="648" width="166" height="20" rx="10" fill="#EEF1FA"/>
    <rect x="300" y="250" width="500" height="340" rx="32" fill="url(#bezel)"/>
    <clipPath id="screenClip"><rect x="318" y="268" width="464" height="304" rx="16"/></clipPath>
    <g clip-path="url(#screenClip)"><svg x="318" y="268" width="464" height="304" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
      <rect width="100" height="100" fill="url(#wall)"/>
      <circle cx="50" cy="42" r="15" fill="#FFF6E0" fill-opacity="0.92"/>
      <path d="M0,70 C18,58 32,60 50,68 C68,76 82,74 100,62 L100,100 L0,100 Z" fill="#5A2BC4" fill-opacity="0.55"/>
      <path d="M0,82 C20,74 38,78 55,84 C72,90 86,88 100,80 L100,100 L0,100 Z" fill="#2E1A86" fill-opacity="0.6"/>
    </svg></g>

    <!-- iPhone -->
    <rect x="214" y="398" width="200" height="390" rx="46" fill="#120A4A" fill-opacity="0.45" filter="url(#soft)" transform="translate(10,18)"/>
    <rect x="214" y="398" width="200" height="390" rx="46" fill="url(#bezel)"/>
    <clipPath id="phoneClip"><rect x="227" y="411" width="174" height="364" rx="34"/></clipPath>
    <g clip-path="url(#phoneClip)"><svg x="227" y="411" width="174" height="364" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
      <rect width="100" height="100" fill="url(#wall)"/>
      <circle cx="50" cy="42" r="15" fill="#FFF6E0" fill-opacity="0.92"/>
      <path d="M0,70 C18,58 32,60 50,68 C68,76 82,74 100,62 L100,100 L0,100 Z" fill="#5A2BC4" fill-opacity="0.55"/>
      <path d="M0,82 C20,74 38,78 55,84 C72,90 86,88 100,80 L100,100 L0,100 Z" fill="#2E1A86" fill-opacity="0.6"/>
    </svg></g>
    <rect x="286" y="425" width="56" height="17" rx="8.5" fill="#0D0B26"/>

    <use href="#body" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
  </g>
</svg>