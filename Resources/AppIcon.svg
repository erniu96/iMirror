<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <rect id="body" x="100" y="100" width="824" height="824" rx="185"/>
    <clipPath id="bodyClip"><use href="#body"/></clipPath>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#A6EA6E"/>
      <stop offset="0.55" stop-color="#4CCB72"/>
      <stop offset="1" stop-color="#1FA37A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#iconShadow)"><use href="#body" fill="url(#bg)"/></g>
  <g clip-path="url(#bodyClip)">
    <use href="#body" fill="url(#glow)"/>
    <path transform="translate(205,235) scale(2.4)" d="M0,-10 C1.5,-2 2,-1.5 10,0 C2,1.5 1.5,2 0,10 C-1.5,2 -2,1.5 -10,0 C-2,-1.5 -1.5,-2 0,-10 Z" fill="#FFFFFF" fill-opacity="0.9"/>
    <path transform="translate(850,700) scale(1.8)" d="M0,-10 C1.5,-2 2,-1.5 10,0 C2,1.5 1.5,2 0,10 C-1.5,2 -2,1.5 -10,0 C-2,-1.5 -1.5,-2 0,-10 Z" fill="#FFFFFF" fill-opacity="0.75"/>
    <path transform="translate(800,190) scale(1.3)" d="M0,-10 C1.5,-2 2,-1.5 10,0 C2,1.5 1.5,2 0,10 C-1.5,2 -2,1.5 -10,0 C-2,-1.5 -1.5,-2 0,-10 Z" fill="#FFFFFF" fill-opacity="0.7"/>
    <circle cx="170" cy="330" r="9" fill="#FFFFFF" fill-opacity="0.6"/>
    <circle cx="860" cy="560" r="7" fill="#FFFFFF" fill-opacity="0.55"/>

    <!-- flat cartoon shadows -->
    <g fill="#0E5A3E" fill-opacity="0.28">
      <rect x="312" y="266" width="500" height="340" rx="44"/>
      <rect x="474" y="660" width="176" height="34" rx="17"/>
      <rect x="226" y="416" width="200" height="390" rx="52"/>
    </g>

    <!-- Mac display -->
    <path d="M516,580 L590,580 L608,662 L498,662 Z" fill="#E9F3EE" stroke="#1F4A36" stroke-width="14" stroke-linejoin="round"/>
    <rect x="462" y="648" width="182" height="34" rx="17" fill="#FFFFFF" stroke="#1F4A36" stroke-width="14"/>
    <rect x="300" y="250" width="500" height="340" rx="44" fill="#FFFFFF" stroke="#1F4A36" stroke-width="14"/>
    <clipPath id="screenClip"><rect x="326" y="276" width="448" height="288" rx="22"/></clipPath>
    <g clip-path="url(#screenClip)"><svg x="326" y="276" width="448" height="288" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#D6F4FF"/>
<circle cx="50" cy="118" r="52" fill="#9BE07F"/>
<circle cx="66" cy="27" r="6" fill="#FFD84D"/>
<circle cx="40" cy="46" r="4.6" fill="#1F4A36"/><circle cx="60" cy="46" r="4.6" fill="#1F4A36"/>
<circle cx="41.4" cy="44.4" r="1.4" fill="#FFFFFF"/><circle cx="61.4" cy="44.4" r="1.4" fill="#FFFFFF"/>
<circle cx="33" cy="56" r="4.2" fill="#FF8FA3" fill-opacity="0.75"/><circle cx="67" cy="56" r="4.2" fill="#FF8FA3" fill-opacity="0.75"/>
<path d="M42,55 Q50,63.5 58,55" fill="none" stroke="#1F4A36" stroke-width="3.4" stroke-linecap="round"/></svg></g>
    <rect x="326" y="276" width="448" height="288" rx="22" fill="none" stroke="#1F4A36" stroke-width="6"/>

    <!-- iPhone -->
    <rect x="214" y="400" width="200" height="390" rx="52" fill="#FFFFFF" stroke="#1F4A36" stroke-width="14"/>
    <clipPath id="phoneClip"><rect x="234" y="420" width="160" height="350" rx="34"/></clipPath>
    <g clip-path="url(#phoneClip)"><svg x="234" y="420" width="160" height="350" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#D6F4FF"/>
<circle cx="50" cy="118" r="52" fill="#9BE07F"/>
<circle cx="66" cy="27" r="6" fill="#FFD84D"/>
<circle cx="40" cy="46" r="4.6" fill="#1F4A36"/><circle cx="60" cy="46" r="4.6" fill="#1F4A36"/>
<circle cx="41.4" cy="44.4" r="1.4" fill="#FFFFFF"/><circle cx="61.4" cy="44.4" r="1.4" fill="#FFFFFF"/>
<circle cx="33" cy="56" r="4.2" fill="#FF8FA3" fill-opacity="0.75"/><circle cx="67" cy="56" r="4.2" fill="#FF8FA3" fill-opacity="0.75"/>
<path d="M42,55 Q50,63.5 58,55" fill="none" stroke="#1F4A36" stroke-width="3.4" stroke-linecap="round"/></svg></g>
    <rect x="234" y="420" width="160" height="350" rx="34" fill="none" stroke="#1F4A36" stroke-width="6"/>
    <rect x="286" y="434" width="56" height="18" rx="9" fill="#1F4A36"/>
  </g>
